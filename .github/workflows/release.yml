name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing version tag to build, for example v0.2.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  release-checks:
    name: Release Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run --if-present lint

      - name: Typecheck frontend
        run: npm run --if-present typecheck

      - name: Test frontend
        run: npm run --if-present test

      - name: Build frontend
        run: npm run --if-present build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows-release:
    name: Windows Release
    runs-on: windows-latest
    needs: release-checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Wallet ${{ env.RELEASE_TAG }}
          releaseBody: |
            Draft Wallet desktop release for ${{ env.RELEASE_TAG }}.

            Review the attached Windows and macOS artifacts before publishing.
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'rc') }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleRoot = Join-Path $PWD "src-tauri/target/release/bundle"
          $checksumFile = Join-Path $PWD "SHA256SUMS.txt"

          $artifacts = Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
            Sort-Object FullName

          if (-not $artifacts) {
            throw "No Windows release artifacts found in $bundleRoot"
          }

          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
            $fileName = $artifact.Name
            "$hash  $fileName"
          }

          Set-Content -LiteralPath $checksumFile -Value $lines -Encoding ascii
          Get-Content -LiteralPath $checksumFile

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallet-windows-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*
            SHA256SUMS.txt

      - name: Attach SHA256 checksums to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ env.RELEASE_TAG }} SHA256SUMS.txt --clobber

  macos-release:
    name: macOS Release (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    needs: release-checks

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            artifact-name: wallet-macos-apple-silicon
          - label: Intel
            runner: macos-13
            target: x86_64-apple-darwin
            artifact-name: wallet-macos-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # Future signed/notarized macOS releases can pass Apple certificate,
      # signing identity, Apple ID, team ID, and app-specific password secrets
      # to this step. Current artifacts are intentionally unsigned and may show
      # Gatekeeper warnings.
      - name: Build Tauri app and attach macOS artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Wallet ${{ env.RELEASE_TAG }}
          releaseBody: |
            Draft Wallet desktop release for ${{ env.RELEASE_TAG }}.

            Review the attached Windows and macOS artifacts before publishing.
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'rc') }}
          args: --target ${{ matrix.target }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail

          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          checksum_file="SHA256SUMS-${{ matrix.target }}.txt"

          if [ ! -d "$bundle_root" ]; then
            echo "No macOS release bundle directory found at $bundle_root" >&2
            exit 1
          fi

          find "$bundle_root" -type f -print0 |
            sort -z |
            xargs -0 shasum -a 256 > "$checksum_file"

          if [ ! -s "$checksum_file" ]; then
            echo "No macOS release artifacts found in $bundle_root" >&2
            exit 1
          fi

          cat "$checksum_file"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            SHA256SUMS-${{ matrix.target }}.txt

      - name: Attach SHA256 checksums to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ env.RELEASE_TAG }} SHA256SUMS-${{ matrix.target }}.txt --clobber
